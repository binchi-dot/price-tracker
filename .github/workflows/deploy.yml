name: 每日物價自動部署

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 更新網站資料與首頁
        run: python3 scripts/update_site.py

      - name: Commit and Push
        run: |
          git config user.name "Price Bot"
          git config user.email "bot@taiwan-price.app"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update: $(date +%Y-%m-%d)"
            git push
          fi

