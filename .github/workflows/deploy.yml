name: 每週物價自動部署

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:
    inputs:
      backfill:
        description: '補抓 2026 年 8 月起的歷史蔬果行情'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: price-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 更新網站資料與首頁
        if: github.event_name != 'push'
        run: python3 scripts/update_site.py

      - name: 驗證資料與頁面
        run: |
          python3 -m unittest discover -s scripts -p test_monitoring.py
          node scripts/test_monitor_ui.cjs

      - name: Commit and Push
        if: github.event_name != 'push'
        run: |
          git config user.name "Price Bot"
          git config user.email "bot@taiwan-price.app"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update: $(date +%Y-%m-%d)"
            git push
          fi

      - name: 準備公開頁面（不包含原始工作簿及程式）
        run: |
          mkdir -p _site
          cp index.html market.html trend.html xiluo.html monitor-data.json _site/

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: 發布 GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

