name: 每日物價自動部署

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: '補抓 2026 年 8 月起的歷史蔬果行情'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 更新網站資料與首頁
        run: python3 scripts/update_site.py

      - name: 補抓歷史行情並重建趨勢圖
        if: inputs.backfill == true
        run: |
          python3 scripts/backfill_history.py --from 2026-08-01
          python3 scripts/update_site.py

      - name: Commit and Push
        run: |
          git config user.name "Price Bot"
          git config user.email "bot@taiwan-price.app"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update: $(date +%Y-%m-%d)"
            git push
          fi

